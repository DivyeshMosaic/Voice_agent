<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Bilingual Voice Assistant</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      font-family: system-ui, Arial;
      padding: 24px;
      max-width: 900px;
      margin: auto;
    }
    #widget {
      border-radius: 12px;
      height: 70vh;
      border: 1px solid #ccc;
      padding: 8px;
    }
  </style>
</head>
<body>

<h1>My Voice Assistant (English + Hindi)</h1>
<p>Click the microphone icon below and speak freely in English or Hindi.</p>

<div id="widget">Loading assistant…</div>

<!-- CORRECT Vapi Web SDK -->
<script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web"></script>

<script>
  // Vapi Public Key
  const client = new Vapi.Client({
    publicKey: "d8d2d5cf-de5c-47e4-a6fa-a80da79d5191"
  });

  // Assistant ID
  client.mount({
    assistantId: "95d4bcc8-1b27-425b-a41b-afcf586b5327",
    container: "#widget",
    theme: "dark",
    microphone: true,
    showTextFallback: true
  });
</script>

</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Bilingual Voice Assistant (Demo)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Arial;padding:24px;max-width:900px;margin:auto}
    #widget{border-radius:10px;height:70vh;border:1px solid #e3e3e3;padding:8px}
    header{display:flex;align-items:center;justify-content:space-between}
    h1{margin:0 0 12px 0;font-size:1.3rem}
    p{margin:6px 0 18px 0;color:#444}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>My Voice Assistant (English + Hindi)</h1>
      <p>Click the microphone in the widget below and speak in English or Hindi.</p>
    </div>
  </header>

  <div id="widget">Loading assistant…</div>

  <!-- Vapi client SDK - ensure this matches Vapi docs if they give a specific snippet -->
  <script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web/dist/vapi.min.js"></script>

  <script>
    // ----- CONFIGURE THESE -----
    const PUBLIC_KEY = "d8d2d5cf-de5c-47e4-a6fa-a80da79d5191";
    const ASSISTANT_ID = "95d4bcc8-1b27-425b-a41b-afcf586b5327";
    // ---------------------------

    // Initialize the widget; Vapi.init() may accept more options in their official snippet
    if (window.Vapi && Vapi.init) {
      Vapi.init({
        publicKey: PUBLIC_KEY,
        assistantId: ASSISTANT_ID,
        container: "#widget",
        theme: "dark",
        microphone: true,
        showTextFallback: true
      });
    } else {
      document.getElementById('widget').innerText = "Vapi SDK failed to load.";
    }
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Bilingual Voice Assistant</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Arial;padding:24px;max-width:900px;margin:auto}
    #widget{border-radius:12px;height:70vh;border:1px solid #ddd;padding:8px}
  </style>
</head>
<body>

<h1>My Voice Assistant (English + Hindi)</h1>
<p>Click the microphone icon and speak freely in English or Hindi.</p>

<div id="widget">Loading assistant…</div>

<!-- Correct Vapi Web SDK script -->
<script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web"></script>

<script>
  const client = new Vapi.Client({
    publicKey: "YOUR_PUBLIC_KEY_HERE"   // <= replace
  });

  client.mount({
    assistantId: "YOUR_ASSISTANT_ID_HERE",  // <= replace
    container: "#widget",
    theme: "dark",
    microphone: true,
    showTextFallback: true
  });
</script>

</body>
</html>

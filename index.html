<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Bilingual Voice Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      font-family: "Inter", Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: #1a1a1a;
      padding: 16px 20px;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.4rem;
      font-size: 1rem;
      animation: fadeIn 0.3s ease;
    }

    .assistant {
      background: #1f1f1f;
      align-self: flex-start;
      border: 1px solid #333;
    }

    .user {
      background: #007aff;
      align-self: flex-end;
      color: white;
    }

    .mic-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #ff3b30;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,0,0,0.4);
      transition: 0.25s ease;
    }

    .mic-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(255,0,0,0.6);
    }

    .mic-btn img {
      width: 32px;
      filter: invert(1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="header">AI Voice Assistant (English + Hindi)</div>

  <div class="chat-container" id="chat"></div>

  <div class="mic-btn" id="micButton">
    <img src="https://cdn-icons-png.flaticon.com/512/709/709496.png" />
  </div>

  <!-- CORRECT VAPI WEB SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/browser/vapi.js"></script>

  <script>
    const chat = document.getElementById("chat");
    const micButton = document.getElementById("micButton");

    const client = new Vapi.Client({
      publicKey: "d8d2d5cf-de5c-47e4-a6fa-a80da79d5191"
    });

    const session = client.mount({
      assistantId: "95d4bcc8-1b27-425b-a41b-afcf586b5327",
      microphone: true
    });

    function addMessage(text, sender = "assistant") {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${sender}`;
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
    }

    session.on("conversation-update", (msg) => {
      if (msg?.delta?.text) addMessage(msg.delta.text, "assistant");
    });

    session.on("transcript", (msg) => {
      if (msg?.transcript) addMessage(msg.transcript, "user");
    });

    let listening = false;

    micButton.addEventListener("click", () => {
      listening = !listening;
      
      if (listening) {
        session.startConversation();
        micButton.style.background = "#4cd964";
      } else {
        session.stopConversation();
        micButton.style.background = "#ff3b30";
      }
    });
  </script>

</body>
</html>
